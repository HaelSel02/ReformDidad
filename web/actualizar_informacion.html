<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReformDidad - Actualizar información personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/actualizarInfo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/actualizarInfo.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script>
        $(document).ready(function () {
            $("#header").load("templates/header.html");
            $("#footer").load("templates/footer.html");
        });
    </script>
</head>

<body>
    <div id="header"></div>

    <div id="formUsuario" class="container-fluid mt-5 mb-5">
        <div class="row d-flex justify-content-center">
            <div class="col-11 col-md-4 p-5 d-flex flex-column align-items-center" id="divPrePass">
        <h2 class="fs-2 p-2 mt-3 mb-3 text-center">Introduce tu contraseña:</h2>
        <div class="input-group mt-4 mb-4" id="divInput">
        <input type='password' class='form-control' id='inputPrePass' name='prepass' placeholder="Introduce tu contraseña...">
        <button class="btn d-flex align-items-center" type="button" id="buttonVista"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash-fill" viewBox="0 0 16 16">
            <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
            <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
          </svg></button>
        </div>
        <div class="text-center mt-4 mb-3">
        <button type='submit' class='btn btn-success me-2' id='enterPass'>Continuar</button>
        <button type='submit' class='btn btn-danger ms-2' id='volverInicio'>Volver</button>
        <div id="divBotonError">
        </div>
    </div>
    </div>
    </div>
    </div>
    <div id="footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</html>
