<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReformDidad - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contacto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="templates/favicon.ico" type="image/x-icon">
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/contacto.js"></script>
    <script>
        $(document).ready(function () {
            $("#header").load("templates/header.html");
            $("#footer").load("templates/footer.html");

        });
    </script>
</head>

<body>
    <div id="header"></div>
    <div class="container-fluid p-md-5">
        <h1 class="mb-5 mt-md-0 mt-5 text-center display-1 fw-medium">¡Contacta con nosotros!</h1>
        <div id="divFormLog" class="container-fluid">
            <div class="row d-flex justify-content-center">
                <div class="col-md-5">
                    <form id="myForm" class="p-4 p-md-5" action="php/enviar_mail.php" method="post">
                        <div class="mb-3">
                            <h3 class="text-center text-lg-start">
                                Introduzca los datos para contactarle:
                            </h3>
                        </div>
                        <div class="mb-3 d-flex flex-column col-md-9">
                            <label class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="inputNombreContacto"
                                placeholder="Introduzca su nombre" name="user" />
                            <p id="pNombre" class="noerrorP"></p>
                        </div>
                        <div class="mb-3 d-flex flex-column col-md-9">
                            <label class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control" id="inputEmailContacto"
                                placeholder="Introduzca su correo electrónico" name="email" />
                            <p id="pEmail" class="noerrorP"></p>
                        </div>
                        <div class="mb-3 d-flex flex-column col-md-9">
                            <label class="form-label">Número de teléfono:</label>
                            <input type="number" class="form-control" id="inputTelefonoContacto"
                                placeholder="Introduzca su número de teléfono" name="telefono" />
                            <p id="pTelefono" class="noerrorP"></p>
                        </div>
                        <div class="mb-3 d-flex flex-column">
                            <label class="form-label">Mensaje:</label>
                            <textarea class="form-control" name="mensaje" id="textareaMensajeContacto" cols="30"
                                rows="10" placeholder="Introduzca su mensaje"></textarea>
                            <p id="pMensaje" class="noerrorP"></p>
                        </div>
                        <div class="mb-3" id="btnForm">
                            <button type="submit" class="btn btn-primary" id="btnEnviarMensaje">
                                Enviar
                            </button>
                            <p id="pBoton" class="noerrorP"></p>
                        </div>
                    </form>
                </div>
                <div class="col-md-1"></div>
                <div class="col-md-5 mt-md-0 mt-5 mb-md-0 mb-5 text-center text-lg-start">
                    <h3>También puedes encontrarnos aquí:</h3>
                    <p class="resaltado">Calle Pare Perera, 2 - bajo <br>
                        46006 - Ruzafa, Valencia</p>
                    <iframe class="ratio ratio-16x9"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3080.2843277600227!2d-0.3768558101127815!3d39.46290493994548!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd6048ca519cdfa3%3A0xbc7cefdb1cf53e7a!2sCarrer%20del%20Pare%20Perera%2C%202%2C%20L&#39;Eixample%2C%2046006%20Val%C3%A8ncia%2C%20Spain!5e0!3m2!1sen!2sbd!4v1712819934922!5m2!1sen!2sbd"
                        width="700" height="550" style="border:0;" allowfullscreen="no" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </div>
    <div id="footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

</html>
