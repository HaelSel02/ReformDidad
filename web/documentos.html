<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReformDidad - Documentos de reformas finalizadas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/privado.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/documentos.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script>
        $(document).ready(function () {
            $("#header").load("templates/header.html");
            $("#footer").load("templates/footer.html");
        });
    </script>
</head>

<body>
    <div id="header"></div>
    <div class="container-fluid" id="divPrincipal">
        <h1 class="nombreUserH1 mt-5 mb-5 text-lg-start text-center"></h1>
        <div class="d-flex justify-content-center mb-5">
            <div id="filtrar" class="d-flex align-items-center flex-column">
                <h2 class="fs-3">Filtrar por:</h2>
                    <select class="form-select" name="selectFiltrosDocumentos" id="selectFiltrosDocumentos">
                        <option selected value="0">Sin filtros</option>
                        <option value="1">Documentos marcados como "favoritos"</option>
                    </select>
                </div>
        </div>
        <div class="table-responsive d-md-flex justify-content-center flex-column align-items-center" id="divTablaDocumentos">
        </div>
        <nav aria-label="Paginacion mostrar tablas" class="mb-5 mt-2" id="navPaginacion">
            <ul class="pagination justify-content-center pagination-lg">
              <li class="page-item" id="liPagAnteriorDocumentos">
                <button class="page-link" id="pagAnteriorDocumentos"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-left-fill" viewBox="0 0 16 16">
                <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
              </svg></button>
              </li>
              <li class="page-item" id="liPagSiguienteDocumentos">
                <button class="page-link" id="pagSiguienteDocumentos"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
              </svg></button>
              </li>
            </ul>
            </nav>
    </div>
    <div id="footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
