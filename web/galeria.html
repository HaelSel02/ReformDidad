<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReformDidad - Galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/galeria.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="templates/favicon.ico" type="image/x-icon">
    <script src="js/jquery-3.7.1.js"></script>
    <script src="js/galeria.js"></script>
    <script>
        $(document).ready(function () {
            $("#header").load("templates/header.html");
            $("#footer").load("templates/footer.html");
        });
    </script>
</head>

<body>
    <div id="header"></div>
    <div class="mb-5 ms-0 me-0 p-0 row d-flex justify-content-center" id="mainDiv">
        <h1 class="mt-5 mb-5 text-center">Galería de reformas</h1>
        <div id="containerGaleria" class="col-md-4">
            <div class="mycontainer" id="containerImagenes">
                <div class="image-container " id="imgsGaleria">

                </div>
                <div id="sliderImgs">
                </div>
            </div>
        </div>
        <div class="col-md-1">
        </div>
        <div class="col-md-5 d-flex align-items-center justify-content-center mt-5 mt-md-0" id="infoGaleria">
        </div>
        <nav aria-label="Page navigation example" class="mt-5">
            <ul class="pagination justify-content-center pagination-lg">
                <li class="page-item" id="liImgsAnterior"><button class="page-link" id="imgsAnterior"><i
                            class="bi bi-caret-left-fill"></i></button>
                <li class="page-item" id="liImgsSiguiente"><button class="page-link" id="imgsSiguiente"><i
                            class="bi bi-caret-right-fill"></i></button>
                </li>
            </ul>
        </nav>
    </div>
    <div id="footer"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
